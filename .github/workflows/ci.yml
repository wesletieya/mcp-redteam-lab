name: CI securite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v4

      - name: Environnement + dependances
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,dashboard]"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Donnees fictives
        run: uv run python -m data.generate

      - name: Tests unitaires
        run: uv run python -m pytest -q

      # Suite de securite reduite : rejoue l'ablation (none vs all) sur le modele le moins cher
      # (mock, deterministe). Les tests ci-dessus echouent deja si l'ASR 'all' remonte au-dessus
      # de 0 ou si l'utilite baisse -> le badge devient rouge.
      - name: Suite securite reduite
        run: uv run python -m eval.run --ablation --quick --model mock --reps 1 --out results/ci.csv
