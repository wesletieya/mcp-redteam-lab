name: Eval securite hebdomadaire (modele reel)

# Suite complete sur un modele API, planifiee (pas a chaque PR) pour maitriser le cout.
# Ne tourne reellement que si le secret ANTHROPIC_API_KEY est configure dans le depot.
on:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi 06:00 UTC
  workflow_dispatch:

jobs:
  full-eval:
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-haiku-5-5
      BUDGET_USD: "2.0"   # plafond de cout par run
    steps:
      - name: Verifier la presence de la cle
        id: guard
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY absent : job ignore (configurer le secret pour activer)."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - name: Installer uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Environnement + dependances
        if: steps.guard.outputs.run == 'true'
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,dashboard,llm]"

      - name: Donnees fictives
        if: steps.guard.outputs.run == 'true'
        run: uv run python -m data.generate

      - name: Ablation complete (budget plafonne)
        if: steps.guard.outputs.run == 'true'
        run: uv run python -m eval.run --ablation --model anthropic --reps 3 --out results/ablation_anthropic.csv

      - name: Publier les resultats
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ablation-anthropic
          path: results/ablation_anthropic.csv
